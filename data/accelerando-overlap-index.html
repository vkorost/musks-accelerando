  { key: "implementation", label: "Active Implementation", desc: "Is Musk actively building something that maps to this Accelerando concept?" },

function Bar({ value, max = 10, color }) {
  const pct = (value / max) * 100;
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
      <div style={{ width: 120, height: 14, background: "#1a1a2e", borderRadius: 3, overflow: "hidden" }}>
        <div style={{ width: `${pct}%`, height: "100%", background: color, borderRadius: 3, transition: "width 0.4s ease" }} />
      </div>
      <span style={{ fontSize: 13, fontWeight: 600, color: "#c4c4d4", minWidth: 20 }}>{value}</span>
    </div>
  );
}

function RadarMini({ item }) {
  const size = 140;
  const cx = size / 2;
  const cy = size / 2;
  const r = 52;
  const keys = ["structural", "awareness", "failureMode", "implementation", "omission"];
  const angles = keys.map((_, i) => (Math.PI * 2 * i) / keys.length - Math.PI / 2);
  const points = keys.map((k, i) => {
    const v = item[k] / 10;
    return `${cx + r * v * Math.cos(angles[i])},${cy + r * v * Math.sin(angles[i])}`;
  }).join(" ");
  const gridLevels = [0.25, 0.5, 0.75, 1];

  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      {gridLevels.map((lv) => (
        <polygon
          key={lv}
          points={keys.map((_, i) => `${cx + r * lv * Math.cos(angles[i])},${cy + r * lv * Math.sin(angles[i])}`).join(" ")}
          fill="none"
          stroke="#2a2a3e"
          strokeWidth={0.5}
        />
      ))}
      {keys.map((_, i) => (
        <line key={i} x1={cx} y1={cy} x2={cx + r * Math.cos(angles[i])} y2={cy + r * Math.sin(angles[i])} stroke="#2a2a3e" strokeWidth={0.5} />
      ))}
      <polygon points={points} fill="rgba(99,179,237,0.15)" stroke="#63b3ed" strokeWidth={1.5} />
      {keys.map((k, i) => (
        <circle key={k} cx={cx + r * (item[k] / 10) * Math.cos(angles[i])} cy={cy + r * (item[k] / 10) * Math.sin(angles[i])} r={2.5} fill="#63b3ed" />
      ))}
      {keys.map((k, i) => {
        const labels = ["Str", "Awr", "Fail", "Impl", "Omit"];
        const lx = cx + (r + 14) * Math.cos(angles[i]);
        const ly = cy + (r + 14) * Math.sin(angles[i]);
        return <text key={k} x={lx} y={ly} fill="#8888a8" fontSize={8} textAnchor="middle" dominantBaseline="middle">{labels[i]}</text>;
      })}
    </svg>
  );
}

function App() {
  const [selected, setSelected] = useState(null);
  const [sortBy, setSortBy] = useState("id");

  const sorted = [...data].sort((a, b) => {
    if (sortBy === "id") return a.id - b.id;
    if (sortBy === "structural") return b.structural - a.structural;
    if (sortBy === "omission") return b.omission - a.omission;
    if (sortBy === "failureMode") return a.failureMode - b.failureMode;
    if (sortBy === "composite") {
      const ca = (a.structural + a.implementation) / 2 - a.failureMode;
      const cb = (b.structural + b.implementation) / 2 - b.failureMode;
      return cb - ca;
    }
    return 0;
  });

  const avgStructural = (data.reduce((s, d) => s + d.structural, 0) / data.length).toFixed(1);
  const avgAwareness = (data.reduce((s, d) => s + d.awareness, 0) / data.length).toFixed(1);
  const avgFailure = (data.reduce((s, d) => s + d.failureMode, 0) / data.length).toFixed(1);
  const avgImpl = (data.reduce((s, d) => s + d.implementation, 0) / data.length).toFixed(1);

    <div style={{ fontFamily: "'JetBrains Mono', 'SF Mono', 'Fira Code', monospace", background: "#0d0d1a", color: "#e0e0f0", minHeight: "100vh", padding: "24px 20px" }}>

            { val: avgFailure, label: "Avg Failure Mode Engagement", color: "#fc8181" },

            { val: avgOmission, label: "Avg Omission Gap", color: "#f6ad55" },

            </div>
          ))}
        </div>

        <div style={{ display: "flex", gap: 8, marginBottom: 16, alignItems: "center" }}>

          {[
            { key: "id", label: "Original" },
            { key: "structural", label: "Alignment" },
            { key: "omission", label: "Omission Gap" },
            { key: "failureMode", label: "Least Engaged" },
            { key: "composite", label: "Danger Score" },
          ].map((s) => (
            <button
              key={s.key}
              onClick={() => setSortBy(s.key)}
              style={{
                fontSize: 11, padding: "4px 10px", borderRadius: 4, border: "1px solid",
                borderColor: sortBy === s.key ? "#63b3ed" : "#2a2a3e",
                background: sortBy === s.key ? "#1a2a4a" : "transparent",
                color: sortBy === s.key ? "#63b3ed" : "#7878a0",

          <p style={{ fontSize: 12, color: "#a0a0c0", lineHeight: 1.7, margin: 0 }}>
            Across 12 concept pairs, Musk's public vision averages <strong style={{ color: "#63b3ed" }}>{avgStructural}/10</strong> structural alignment with Accelerando and <strong style={{ color: "#68d391" }}>{avgImpl}/10</strong> active implementation, but only <strong style={{ color: "#fc8181" }}>{avgFailure}/10</strong> engagement with the failure modes Stross identifies. The omission gap averages <strong style={{ color: "#f6ad55" }}>{avgOmission}/10</strong>. The "Danger Score" (high alignment + high implementation, low failure mode engagement) is highest for Post-Scarcity Economics, Mind Uploading, Algorithmic Governance, and Planetary Compute. These are domains where Musk is actively building infrastructure that maps onto Accelerando's trajectory while showing the least engagement with the catastrophic endpoints Stross describes.
